<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clinic Dashboard — Log in</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex;
           align-items: center; justify-content: center; height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
           width: 20rem; }
    h1 { font-size: 1.1rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: .85rem; margin: .75rem 0 .25rem; color: #333; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; margin-top: 1.25rem; padding: .6rem; border: none; border-radius: 4px;
             background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { background: #fee2e2; color: #991b1b; padding: .5rem .75rem; border-radius: 4px;
              font-size: .85rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Clinic Dashboard</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Log in</button>
  </form>
</body>
</html>
