[project]
name = "dental-ig-assistant"
version = "0.1.0"
description = "Multi-tenant AI assistant bot for dental clinics over Instagram"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # [asyncio] brings greenlet, which the async engine cannot run without.
    # SQLAlchemy 2.1 stopped installing it by default and a deploy died on
    # startup; held below 2.1 until that upgrade is tested on its own.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "openai>=1.50",
    # app.services.sheets signs its service-account requests with these. Both
    # used to arrive for free underneath google-genai, and removing Gemini took
    # requests with it: google.auth.transport.requests imports it at module
    # level, so app.workers.tasks failed to import and the worker crash-looped
    # on the deploy that dropped google-genai. Declared now, not leaned on.
    "google-auth>=2.0",
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "cryptography>=43",
    # zoneinfo (used by app.services.appointment for Asia/Tashkent working
    # hours) needs an IANA tzdata source. Neither Windows nor the slim
    # python:3.12-slim base image ships one, so this must be an explicit
    # dependency rather than relying on the OS to provide it.
    "tzdata>=2024.1",
    "jinja2>=3.1",
    # Parses multipart/x-www-form-urlencoded request bodies — required by
    # FastAPI's Form(...) params (the operator dashboard's login/booking
    # forms), not pulled in automatically by fastapi itself.
    "python-multipart>=0.0.12",
    # Signs the operator session cookie (app.core.session) — payload is
    # tamper-evident, not encrypted, so it carries only operator_id +
    # csrf_token, never a secret.
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    # Read the files a clinic uploads to its knowledge base
    # (app.services.documents). All three are pure Python, so the slim image
    # needs nothing installed beside them.
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    # The three gate tools are pinned exactly, not floored. CI runs
    # `ruff check`, `black --check` and `mypy` as pass/fail gates, and all
    # three change what they accept between releases -- black reflows code
    # it used to leave alone, ruff adds rules to the selected sets, mypy
    # gets stricter. With a floor like ">=24.10" the gate is really "latest
    # at install time", so a green branch turns red on a day nobody touched
    # it, and the fix is a formatting-only commit that collides with every
    # branch in flight. Bumping these is a deliberate commit of its own.
    "ruff==0.16.4",
    "black==26.5.1",
    "mypy==2.3.1",
    # openpyxl ships no type information; app.services.documents imports it.
    "types-openpyxl",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
# Depends was already here; Query/Form join it for the same reason — B008
# only auto-exempts a default call when the parameter's own type annotation
# is one of ruff's hardcoded immutable types, which doesn't include
# datetime.date (see e.g. app.api.dashboard's `date`-typed Form params).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["app/core/config.py", "app/core/db.py", "app/core/queue.py"]
concurrency = ["greenlet", "thread"]
